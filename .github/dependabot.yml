version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # await-lock 3.x is ESM-only; project still uses CommonJS interop. Pin until ESM migration.
      - dependency-name: 'await-lock'
        update-types: ['version-update:semver-major']
      # typescript 6.x deprecates options we still set; revisit when 6.x is stable + we're ready to migrate.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      types:
        patterns:
          - '@types/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
      mocha:
        patterns:
          - 'mocha'
          - '@types/mocha'
          - 'chai'
          - '@types/chai'
          - 'sinon'
          - '@types/sinon'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
