name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Release notes script
        run: bash scripts/release-notes.test.sh

  integration:
    name: integration tests (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One leg per supported major, so a migration or a test that leans on a
      # newer server fails here and not on an operator's database. 14 is the
      # floor README.md documents, 16 is the docker-compose.yml default, and 18
      # is the major the live eca-small-chains CNPG cluster runs. Every leg
      # finishes even when another fails, so one run shows every affected major.
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # init-test-db reads POSTGRES_TEST_* (CI mode). PGSSLMODE override is
      # required because src/connections/postgres.ts defaults to `prefer`,
      # which throws against the GHA postgres service container (no SSL
      # configured by default).
      PGSSLMODE: disable
      POSTGRES_TEST_HOST: localhost
      POSTGRES_TEST_PORT: 5432
      POSTGRES_TEST_USER: root
      POSTGRES_TEST_PASSWORD: testpassword
      POSTGRES_TEST_DATABASE: test_db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration:ci

  # Branch protection requires this check by name, and a matrix leg carries its
  # version in its name, so this job keeps the fixed name and passes only when
  # every leg passed. A cancelled or timed-out leg is not a pass.
  integration-gate:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: integration
    if: always()
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.integration.result }}
        run: |
          case "$RESULT" in
            success) echo "every integration leg passed" ;;
            *) echo "integration matrix result: $RESULT"; exit 1 ;;
          esac
