name: Release

on:
  push:
    branches: [main]
    tags: ['*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build & push image to ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/atomicassets/atomicassets-api
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` follows the current major, which is the 2.x line. Its release
            # tags are unprefixed (`2.0.0`) while the 1.7 maintenance line keeps its
            # `v` prefix, so a maintenance release cannot pull unpinned operators back
            # a major. The `2.` test also keeps branch builds out: `github.ref_name` is
            # `main` there, and this job runs on pushes to main as well as on tags.
            # A `-` means a semver prerelease, which never becomes `latest`.
            # Widen the prefix at the next major.
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, '2.') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
