name: Release

on:
  push:
    branches: [main]
    tags: ['*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build & push image to ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/atomicassets/atomicassets-api
          # latest=false, not merely the absence of a `latest` tag entry.
          # metadata-action defaults flavor.latest to `auto`, and under auto it
          # sets latest on every semver tag that is not a prerelease, with no
          # entry in `tags` required. Omitting the entry therefore publishes
          # `latest` from this line anyway: v1.7.27 took it that way. `latest`
          # follows the current major, which is the 2.x line, so this branch
          # must opt out explicitly. Prereleases were always exempt, which is
          # why the 2.x candidates never moved it.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
